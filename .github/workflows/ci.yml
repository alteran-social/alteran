name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install npm deps (via Deno nodeModulesDir)
        run: deno install --allow-scripts
      - name: Build
        run: deno task build
      - name: Tests
        run: deno task test
      - name: Verify production build configuration
        run: RUN_APP_TESTS=true deno test -A --no-check tests/deploy-build.e2e.test.ts
      - name: Verify built Worker authentication
        env:
          RUN_APP_TESTS: 'true'
        run: |
          export MINIFLARE_WORKERD_PATH="$(deno eval --frozen 'import workerd from "npm:workerd@1.20260511.1"; console.log(workerd.default)')"
          test -x "$MINIFLARE_WORKERD_PATH"
          deno test -A --no-check tests/legacy-jwt-worker.e2e.test.ts
          deno test -A --no-check tests/consumer-env-isolation.e2e.test.ts
      - name: Typecheck
        run: deno task check
      - name: Test Worker request signals and private reads
        env:
          ALTERAN_LIVE_REQUEST_SIGNAL_TEST: '1'
          RUN_APP_TESTS: 'true'
        run: |
          export MINIFLARE_WORKERD_PATH="$(deno eval --frozen 'import workerd from "npm:workerd@1.20260511.1"; console.log(workerd.default)')"
          test -x "$MINIFLARE_WORKERD_PATH"
          deno test -A --no-check tests/spaces-request-signal.test.ts tests/spaces-built-worker.e2e.test.ts \
            tests/spaces-owner-listing-built.e2e.test.ts tests/spaces-owner-listing-consumer.e2e.test.ts
